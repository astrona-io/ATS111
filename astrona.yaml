            url: https://perses.dev/perses-operator/docs/api/

  - id: module-020
    title: "Dashboards And Datasources As Kubernetes Resources"
    description: >
      PersesDatasource and PersesGlobalDatasource, PersesDashboard, how a
      namespace becomes a Perses project, how instanceSelector picks the
      servers, what happens on update and delete, and file provisioning as
