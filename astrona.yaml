# Course manifest for ATS111 - Kubernetes-Native Operations & The Perses Operator (Perses).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS111
  title: "Perses: Kubernetes-Native Operations & The Perses Operator"
  maturity: draft
  description: >
    Training material covering the Kubernetes-Native Operations & The Perses
    Operator domain of the Perses training path: installing the Perses
    Operator, running a Perses server from a Perses resource and reading its
    status, declaring dashboards and datasources as custom resources in
    application namespaces, delivering them from Git with Flux, and keeping
    teams apart with namespaces, Kubernetes RBAC and Flux impersonation.
    Each module pairs a layered reader with an ungraded hands-on playground
    and a graded practice lab. Each section closes with an integration
    capstone. Written for the Perses Operator v0.5.0 and Perses v0.54.0.

  certification:
    name: Perses
    code: PERSES
    provider: Astrona
    domain: Kubernetes-Native Operations & The Perses Operator
    weight: 15

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Running Perses With The Perses Operator"
    description: >
      What the Perses Operator is and how it reconciles, installing it with
      Helm, the Perses resource that describes one Perses server, and reading
      the status conditions and logs that say why a server does not run.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Run Perses With The Perses Operator"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "What The Perses Operator Does"
        path: sections/section-010/module-01/course-01-what-the-operator-does.md
      - type: reading
        title: "The Perses Resource"
        path: sections/section-010/module-01/course-02-the-perses-resource.md
      - type: reading
        title: "Status Conditions And Troubleshooting"
        path: sections/section-010/module-01/course-03-status-and-troubleshooting.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Fix A Perses Server That Never Serves Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: operator
        task_kind: troubleshooting
        tags: [perses-operator, perses-cr, status-conditions, operator-logs, reconciliation]
        learning_goals:
          - Read why a Perses resource is degraded from its status conditions and the operator log
          - Fix the image and the volume definition without deleting the Perses resource
          - Prove the server runs with a ready Deployment and an answer from the Perses API
        resources:
          - name: "Perses Operator user guide"
            url: https://perses.dev/perses-operator/docs/user-guide/
          - name: "Perses Operator API reference"
            url: https://perses.dev/perses-operator/docs/api/
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Make The Operator Reach Its Perses Server Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: operator
        task_kind: troubleshooting
        tags: [perses-operator, perses-cr, status-conditions, reconciliation, perses-dashboard, operator-logs]
        learning_goals:
          - Find why dashboards report PersesConnectionFailed while the Perses resource says Available
          - Fix the Service name and the memory limit of a Perses server in place
          - Prove the result with a stable Perses pod and a dashboard the Perses API serves
        resources:
