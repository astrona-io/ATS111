        estimated_duration: 20m
        topic: custom-resources
        task_kind: build
        tags: [perses-dashboard, perses-datasource, namespace-project, instance-selector, crd]
        learning_goals:
          - Declare a datasource and a dashboard as custom resources in two team namespaces
          - Explain how each namespace becomes a Perses project
          - Prove the result with the Perses API and a query through each team's datasource
        resources:
          - name: "Perses Operator user guide"
            url: https://perses.dev/perses-operator/docs/user-guide/
          - name: "Dashboard API"
