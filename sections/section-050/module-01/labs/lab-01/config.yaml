# Restore A Lost Project From A Backup
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-111-lab-050-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses-operator"
      description: "Installs Helm, percli, Prometheus, the tester pod and the Perses Operator 0.5.0"
      type: "file"
      source: "bootstrap/01-install-perses-operator.sh"
    - name: "ats-111-lab-050-01-setup"
      description: "Creates the projects ledger and notes through the API, saves a backup of ledger and deletes ledger"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus and the tester pod in the namespace observability."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until the operator and the Perses server answer"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-ledger-project"
      description: "The project ledger exists on the server"
      type: "file"
      source: "validation/validate-ledger-project.sh"
    - name: "validate-ledger-dashboard"
      description: "The dashboard daily is restored with its display name and duration"
      type: "file"
      source: "validation/validate-ledger-dashboard.sh"
    - name: "validate-notes-backup"
      description: "The ConfigMap notes-backup holds the dashboard todo"
      type: "file"
      source: "validation/validate-notes-backup.sh"
    - name: "validate-nothing-lost"
      description: "The ledger backup is unchanged and notes still exists"
      type: "file"
      source: "validation/validate-nothing-lost.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
