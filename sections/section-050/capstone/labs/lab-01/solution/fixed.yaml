apiVersion: v1
kind: Namespace
metadata:
  name: reports
---
apiVersion: v1
kind: Namespace
metadata:
  name: finance
---
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: reports
  namespace: reports
  labels:
    app.kubernetes.io/instance: reports
spec:
  image: docker.io/persesdev/perses:v0.54.0
  containerPort: 8080
  config:
    database:
      file:
        folder: /perses
        extension: yaml
  storage:
    emptyDir: {}
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: weekly
  namespace: finance
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: reports
  config:
    display:
      name: Weekly Report
    duration: 7d
    panels: {}
    layouts: []
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: monthly
  namespace: finance
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: reports
  config:
    display:
      name: Monthly Report
    duration: 30d
    panels:
      totals:
        kind: Panel
        spec:
          display:
            name: Totals
          plugin:
            kind: Markdown
            spec:
              text: Monthly totals
    layouts:
      - kind: Grid
        spec:
          items:
            - x: 0
              y: 0
              width: 12
              height: 6
              content:
                $ref: "#/spec/panels/totals"
