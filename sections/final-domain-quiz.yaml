# Final domain knowledge check across all five sections.
schema_version: 1
kind: question_bank
id: ats111-final
course_id: ATS111
exam_code: PERSES
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: kubernetes-native-operations
  title: "Kubernetes-Native Operations & The Perses Operator"
placement:
  position: after
  reading: sections/section-050/capstone/labs/lab-01/question.md
questions:
  - id: ats111-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the custom resources of the operator"
    source_readings:
      - sections/section-010/module-01/course-01-what-the-operator-does.md
    prompt: "Which of these kinds is cluster-scoped?"
    options:
      - id: a
        text: "`PersesDashboard`"
        explanation: "Not correct. A `PersesDashboard` is namespaced."
      - id: b
        text: "`PersesGlobalDatasource`"
        explanation: "Correct. It has no namespace and becomes a global datasource in Perses."
      - id: c
        text: "`PersesDatasource`"
        explanation: "Not correct. A `PersesDatasource` is namespaced."
      - id: d
        text: "`Perses`"
        explanation: "Not correct. A `Perses` resource is namespaced."
    correct_option: b
    explanation: "Correct. It has no namespace and becomes a global datasource in Perses."

  - id: ats111-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the certManager.enable setting"
    source_readings:
      - sections/section-010/module-01/course-01-what-the-operator-does.md
    prompt: "The playground installs the chart with `certManager.enable=false`. What is the effect?"
    options:
      - id: a
        text: "The operator stops using TLS for the Perses API."
        explanation: "Not correct. The setting concerns the operator's webhook certificate."
      - id: b
        text: "The CRDs are removed when the chart is uninstalled."
        explanation: "Not correct. The chart keeps the CRDs because `crd.keep` is true."
      - id: c
        text: "The chart makes a self-signed webhook certificate, and only `v1alpha2` objects can be used."
        explanation: "Correct. The conversion webhooks between versions are off."
      - id: d
        text: "Dashboards need no `instanceSelector`."
        explanation: "Not correct. The setting has no effect on selectors."
    correct_option: c
    explanation: "Correct. The conversion webhooks between versions are off."

  - id: ats111-final-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Find the operator log"
    source_readings:
      - sections/section-010/module-01/course-03-status-and-troubleshooting.md
    prompt: "In which container of `perses-operator-controller-manager` do you find the reconciliation log?"
    options:
      - id: a
        text: "`kube-rbac-proxy`"
        explanation: "Not correct. That container protects the metrics endpoint."
      - id: b
        text: "`perses`"
        explanation: "Not correct. That is the name of the server, not a container of the operator."
      - id: c
        text: "`manager`"
        explanation: "Correct. The container `manager` runs the reconciliation."
      - id: d
        text: "`webhook`"
        explanation: "Not correct. The operator pod has no container named `webhook`."
    correct_option: c
    explanation: "Correct. The container `manager` runs the reconciliation."

  - id: ats111-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the right URL for an HTTP proxy datasource"
    source_readings:
      - sections/section-020/module-01/course-01-datasources-as-custom-resources.md
    prompt: "A datasource uses an HTTP proxy to Prometheus. Which URL is right?"
    options:
      - id: a
        text: "The cluster address, for example `http://prometheus.observability.svc.cluster.local:9090`."
        explanation: "Correct. The Perses server sends the query, so the address must work inside the cluster."
      - id: b
        text: "An address that only works from your browser, such as `http://localhost:9090`."
        explanation: "Not correct. The browser does not call Prometheus with a proxy."
      - id: c
        text: "The address of the Perses Service."
        explanation: "Not correct. That would send the query back to Perses."
      - id: d
        text: "The address of the Perses Operator."
        explanation: "Not correct. The operator does not answer Prometheus queries."
    correct_option: a
    explanation: "Correct. The Perses server sends the query, so the address must work inside the cluster."

  - id: ats111-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what happens to edits made in Perses"
    source_readings:
      - sections/section-020/module-01/course-02-dashboards-as-custom-resources.md
    prompt: "You change a dashboard title in the Perses user interface. What happens at the next reconciliation of the object?"
    options:
      - id: a
        text: "The operator copies the change back into the object."
        explanation: "Not correct. The operator only writes from the object to Perses."
      - id: b
        text: "The object is marked `Degraded`."
        explanation: "Not correct. The operator reports no error for an edit made in Perses."
      - id: c
        text: "The change stays forever."
        explanation: "Not correct. The next reconciliation replaces it."
      - id: d
        text: "The operator overwrites the change with the content of the object."
        explanation: "Correct. The object is the source of truth."
    correct_option: d
    explanation: "Correct. The object is the source of truth."

  - id: ats111-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the ValidationFailed reason"
    source_readings:
      - sections/section-020/module-01/course-02-dashboards-as-custom-resources.md
    prompt: "A dashboard layout refers to a panel that does not exist. Which reason does the object show?"
    options:
      - id: a
        text: "`PersesMissing`"
        explanation: "Not correct. A server was found, so the reason is not about selection."
      - id: b
        text: "`Reconciled`"
        explanation: "Not correct. That reason belongs to a successful sync."
      - id: c
        text: "`ValidationFailed`, with the message of the Perses server."
        explanation: "Correct. The operator sent the dashboard and the server refused it."
      - id: d
        text: "`InvalidConfiguration`"
        explanation: "Not correct. That reason belongs to a `Perses` resource, not a dashboard."
    correct_option: c
    explanation: "Correct. The operator sent the dashboard and the server refused it."

  - id: ats111-final-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Lay out a dashboards repository"
    source_readings:
      - sections/section-030/module-01/course-01-dashboards-in-git.md
    prompt: "What does the folder of one team in the repository hold?"
    options:
      - id: a
        text: "The team's `PersesDatasource` and `PersesDashboard` files, and no `Namespace` objects."
        explanation: "Correct. The platform creates the namespaces."
      - id: b
        text: "The team's `Namespace` and `Perses` objects."
        explanation: "Not correct. Namespaces and the server stay with the platform."
      - id: c
        text: "A Flux `Kustomization` for every other team."
        explanation: "Not correct. A team folder holds only what the team owns."
      - id: d
        text: "The Perses database files of the team."
        explanation: "Not correct. Perses stores its own data, not Git."
    correct_option: a
    explanation: "Correct. The platform creates the namespaces."

  - id: ats111-final-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict who corrects an edit made in Perses"
    source_readings:
      - sections/section-030/module-01/course-02-drift-pruning-and-the-operator.md
    prompt: "Someone edits a dashboard title in the Perses user interface. Why does Flux not fix it?"
    options:
      - id: a
        text: "Flux does not support dashboards."
        explanation: "Not correct. Flux applies any Kubernetes object."
      - id: b
        text: "Flux only checks Perses once a day."
        explanation: "Not correct. Flux never checks Perses."
      - id: c
        text: "The object in the cluster still matches Git, so Flux sees no difference."
        explanation: "Correct. Only a reconciliation of the object by the operator writes the object back."
      - id: d
        text: "The edit is saved in Git automatically."
        explanation: "Not correct. Perses never writes to Git."
    correct_option: c
    explanation: "Correct. Only a reconciliation of the object by the operator writes the object back."

  - id: ats111-final-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Know the effect of prune false"
    source_readings:
      - sections/section-030/module-01/course-02-drift-pruning-and-the-operator.md
    prompt: "A file is removed from Git while `prune: false`. Later you set `prune: true`. What happens to the dashboard?"
    options:
      - id: a
        text: "Flux deletes it on the next run."
        explanation: "Not correct. The inventory no longer lists it."
      - id: b
        text: "It stays in the cluster and in Perses until someone deletes it by hand."
        explanation: "Correct. It dropped out of the inventory without being deleted."
      - id: c
        text: "The operator deletes it from Perses."
        explanation: "Not correct. The object still exists, so the operator keeps the dashboard."
      - id: d
        text: "Flux marks the `Kustomization` as failed."
        explanation: "Not correct. Flux reports no error for an orphan."
    correct_option: b
    explanation: "Correct. It dropped out of the inventory without being deleted."

  - id: ats111-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a Role for Perses objects"
    source_readings:
      - sections/section-040/module-01/course-01-rbac-for-perses-resources.md
    prompt: "Which rule gives a team the right to deliver dashboards?"
    options:
      - id: a
        text: "The same verbs with `apiGroups: [\"\"]`."
        explanation: "Not correct. The core group does not hold Perses kinds, so the rule grants nothing."
      - id: b
        text: "Verbs on `persesdashboards` and `persesdatasources` with `apiGroups: [\"perses.dev\"]`, in a Role in the team namespace."
        explanation: "Correct. The API group must match."
      - id: c
        text: "A ClusterRole bound with a ClusterRoleBinding."
        explanation: "Not correct. That gives the same rights in every namespace."
      - id: d
        text: "The verb `*` on `perses`."
        explanation: "Not correct. That would also allow changing the server for everyone."
    correct_option: b
    explanation: "Correct. The API group must match."

  - id: ats111-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make a pipeline act as a team"
    source_readings:
      - sections/section-040/module-01/course-02-tenant-pipelines-and-perses-authorization.md
    prompt: "Which field makes a Flux `Kustomization` apply as a ServiceAccount?"
    options:
      - id: a
        text: "`spec.serviceAccountName`"
        explanation: "Correct. Kustomize-controller impersonates it for every apply and prune."
      - id: b
        text: "`spec.sourceRef`"
        explanation: "Not correct. It names the source, not the identity."
      - id: c
        text: "`spec.targetNamespace`"
        explanation: "Not correct. It sets a namespace, not an identity."
      - id: d
        text: "`spec.prune`"
        explanation: "Not correct. It controls deletion."
    correct_option: a
    explanation: "Correct. Kustomize-controller impersonates it for every apply and prune."

  - id: ats111-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the lockdown flags"
    source_readings:
      - sections/section-040/module-01/course-02-tenant-pipelines-and-perses-authorization.md
    prompt: "Which flag makes a `Kustomization` without `serviceAccountName` impersonate a default account?"
    options:
      - id: a
        text: "`--no-cross-namespace-refs=true`"
        explanation: "Not correct. It stops references to sources in other namespaces."
      - id: b
        text: "`--no-remote-bases=true`"
        explanation: "Not correct. It stops remote Kustomize bases."
      - id: c
        text: "`--default-service-account=<name>`"
        explanation: "Correct. It is set on kustomize-controller and helm-controller."
      - id: d
        text: "`--watch-all-namespaces=false`"
        explanation: "Not correct. It is not a lockdown flag for impersonation."
    correct_option: c
    explanation: "Correct. It is set on kustomize-controller and helm-controller."


  - id: ats111-final-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose storage that survives a restart"
    source_readings:
      - sections/section-010/module-02/course-01-persistent-storage.md
    prompt: "Which workload kind does the operator create when `spec.storage` is `emptyDir`?"
    options:
      - id: a
        text: "A StatefulSet with one PersistentVolumeClaim."
        explanation: "Not correct. A StatefulSet is used for storage other than `emptyDir`."
      - id: b
        text: "A Deployment, and the database is lost with the pod."
        explanation: "Correct. With `emptyDir` the data lives only as long as the pod does."
      - id: c
        text: "A DaemonSet on every node."
        explanation: "Not correct. The operator never runs a Perses server as a DaemonSet."
      - id: d
        text: "A CronJob that copies the database away."
        explanation: "Not correct. The operator creates no backup job."
    correct_option: b
    explanation: "Correct. With `emptyDir` the data lives only as long as the pod does."

  - id: ats111-final-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Find who validates the configuration"
    source_readings:
      - sections/section-010/module-02/course-02-server-configuration.md
    prompt: "You put a wrong value in `spec.config`. Where do you find the reason that the server does not start?"
    options:
      - id: a
        text: "In the log of the operator, because it validates the block."
        explanation: "Not correct. The operator does not read the content."
      - id: b
        text: "In the status of the `Perses` resource only."
        explanation: "Not correct. The status may not name the value."
      - id: c
        text: "In the log of the Perses pod, because the server validates the file."
        explanation: "Correct. The operator copies the block into a ConfigMap without reading it."
      - id: d
        text: "In the Kubernetes API server response at apply time."
        explanation: "Not correct. The schema accepts any content in this block."
    correct_option: c
    explanation: "Correct. The operator copies the block into a ConfigMap without reading it."

  - id: ats111-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order the client and authentication settings"
    source_readings:
      - sections/section-010/module-02/course-04-tls-provisioning-client.md
    prompt: "When must `spec.client` be set on the `Perses` resource?"
    options:
      - id: a
        text: "After authentication is turned on, once the first login fails."
        explanation: "Not correct. Delivery has already stopped by then."
      - id: b
        text: "Only when read-only mode is on."
        explanation: "Not correct. Read-only mode refuses writes whatever the client is."
      - id: c
        text: "Never, because the operator uses its ServiceAccount."
        explanation: "Not correct. The server does not know the ServiceAccount."
      - id: d
        text: "Before authentication is turned on, so the operator can still log in."
        explanation: "Correct. Without credentials the operator cannot write to the server."
    correct_option: d
    explanation: "Correct. Without credentials the operator cannot write to the server."

  - id: ats111-final-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a selector reads"
    source_readings:
      - sections/section-020/module-02/course-01-several-servers-and-selectors.md
    prompt: "Which labels does `instanceSelector` match?"
    options:
      - id: a
        text: "The labels in the `metadata.labels` of the `Perses` resources."
        explanation: "Correct. The selector chooses among servers."
      - id: b
        text: "The labels of the dashboard itself."
        explanation: "Not correct. That would match nothing useful."
      - id: c
        text: "The labels of the namespace of the dashboard."
        explanation: "Not correct. Namespace labels are not used."
      - id: d
        text: "The labels of the pods of the server."
        explanation: "Not correct. Pod labels are set by `spec.metadata`."
    correct_option: a
    explanation: "Correct. The selector chooses among servers."

  - id: ats111-final-q17
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict what a narrowed selector does"
    source_readings:
      - sections/section-020/module-02/course-01-several-servers-and-selectors.md
    prompt: "You narrow a selector so it no longer matches the server `old`. What happens to the dashboard on `old`?"
    options:
      - id: a
        text: "It is deleted at once."
        explanation: "Not correct. No removal is done."
      - id: b
        text: "It stays there, so you check the old server after the change."
        explanation: "Correct. The operator does not remove the copy from a server that no longer matches."
      - id: c
        text: "It is moved to the new server together with its data."
        explanation: "Not correct. It is sent again, not moved."
      - id: d
        text: "The dashboard becomes `Degraded`."
        explanation: "Not correct. Nothing marks it as degraded."
    correct_option: b
    explanation: "Correct. The operator does not remove the copy from a server that no longer matches."

  - id: ats111-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a dry run"
    source_readings:
      - sections/section-020/module-02/course-04-preview-and-change-safely.md
    prompt: "What does a server-side dry run of a `PersesDashboard` check?"
    options:
      - id: a
        text: "Everything the Perses server checks."
        explanation: "Not correct. The dry run stops at the API server."
      - id: b
        text: "Only that the namespace exists."
        explanation: "Not correct. It checks much more than that."
      - id: c
        text: "The schema of the object, not the panels inside `spec.config`."
        explanation: "Correct. The panels are checked later by the Perses server."
      - id: d
        text: "That Prometheus answers the queries."
        explanation: "Not correct. No query is run."
    correct_option: c
    explanation: "Correct. The panels are checked later by the Perses server."

  - id: ats111-final-q19
    type: single_choice
    difficulty: beginner
    learning_objective: "Order deliveries"
    source_readings:
      - sections/section-030/module-02/course-01-order-and-health.md
    prompt: "What does `dependsOn` on a Flux `Kustomization` do?"
    options:
      - id: a
        text: "It applies the listed Kustomizations first by itself."
        explanation: "Not correct. It only waits."
      - id: b
        text: "It copies their files into its own path."
        explanation: "Not correct. Each keeps its own path."
      - id: c
        text: "It fixes failing health checks."
        explanation: "Not correct. It does not repair anything."
      - id: d
        text: "It waits until the listed Kustomizations are `Ready` before it applies."
        explanation: "Correct. Without it there is no order."
    correct_option: d
    explanation: "Correct. Without it there is no order."

  - id: ats111-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Bound a health check"
    source_readings:
      - sections/section-030/module-02/course-01-order-and-health.md
    prompt: "Which field bounds how long Flux waits for the health checks?"
    options:
      - id: a
        text: "`timeout`"
        explanation: "Correct. It limits the wait."
      - id: b
        text: "`interval`"
        explanation: "Not correct. It sets how often Flux reconciles."
      - id: c
        text: "`retryInterval`"
        explanation: "Not correct. It sets the wait after a failure."
      - id: d
        text: "`prune`"
        explanation: "Not correct. It controls removal of objects."
    correct_option: a
    explanation: "Correct. It limits the wait."

  - id: ats111-final-q21
    type: single_choice
    difficulty: advanced
    learning_objective: "Spot a hidden failure"
    source_readings:
      - sections/section-030/module-02/course-03-variables-from-the-cluster.md
    prompt: "A delivery is `Ready` but the dashboard is missing in Perses. What do you read next?"
    options:
      - id: a
        text: "Nothing. `Ready` means it works."
        explanation: "Not correct. It only means the apply succeeded."
      - id: b
        text: "The conditions of the Perses object, because Perses may refuse the content."
        explanation: "Correct. Flux does not check the Perses side."
      - id: c
        text: "Only the Flux log."
        explanation: "Not correct. Flux has no error to show."
      - id: d
        text: "The node events."
        explanation: "Not correct. They are unrelated."
    correct_option: b
    explanation: "Correct. Flux does not check the Perses side."

  - id: ats111-final-q22
    type: single_choice
    difficulty: beginner
    learning_objective: "Write a quota key"
    source_readings:
      - sections/section-040/module-02/course-01-cap-what-a-team-can-create.md
    prompt: "Which key caps the number of `PersesDashboard` objects in a namespace?"
    options:
      - id: a
        text: "`persesdashboards`"
        explanation: "Not correct. A group is needed."
      - id: b
        text: "`count/dashboards`"
        explanation: "Not correct. The resource and group are needed."
      - id: c
        text: "`count/persesdashboards.perses.dev`"
        explanation: "Correct. The form is `count/<resource>.<group>`."
      - id: d
        text: "`limits.persesdashboards`"
        explanation: "Not correct. That form is for compute resources."
    correct_option: c
    explanation: "Correct. The form is `count/<resource>.<group>`."

  - id: ats111-final-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name who needs access"
    source_readings:
      - sections/section-040/module-02/course-02-restrict-who-can-call-the-server.md
    prompt: "A NetworkPolicy limits calls to the Perses server. Which namespace must be allowed?"
    options:
      - id: a
        text: "Only the team namespaces."
        explanation: "Not correct. The operator would be blocked."
      - id: b
        text: "`kube-system` only."
        explanation: "Not correct. It is unrelated."
      - id: c
        text: "No namespace. Policies never block the operator."
        explanation: "Not correct. They do."
      - id: d
        text: "The namespace of the operator, or delivery stops."
        explanation: "Correct. The operator calls the server API."
    correct_option: d
    explanation: "Correct. The operator calls the server API."

  - id: ats111-final-q24
    type: single_choice
    difficulty: beginner
    learning_objective: "Inspect the operator"
    source_readings:
      - sections/section-040/module-02/course-04-least-privilege-for-the-operator.md
    prompt: "Which command checks what a ServiceAccount may do?"
    options:
      - id: a
        text: "`kubectl auth can-i <verb> <resource> --as system:serviceaccount:<ns>:<name>`"
        explanation: "Correct. It asks the API server with that identity."
      - id: b
        text: "`kubectl get rolebinding`"
        explanation: "Not correct. It lists bindings only."
      - id: c
        text: "`kubectl describe perses`"
        explanation: "Not correct. It does not show rights."
      - id: d
        text: "`kubectl top sa`"
        explanation: "Not correct. No such command."
    correct_option: a
    explanation: "Correct. It asks the API server with that identity."

  - id: ats111-final-q25
    type: single_choice
    difficulty: beginner
    learning_objective: "Read state in order"
    source_readings:
      - sections/section-050/module-01/course-01-see-what-the-platform-is-doing.md
    prompt: "What do you read first when a Perses object does not work?"
    options:
      - id: a
        text: "The node logs."
        explanation: "Not correct. They are too far from the cause."
      - id: b
        text: "Its status conditions."
        explanation: "Correct. They are the operator's own summary."
      - id: c
        text: "The operator's source code."
        explanation: "Not correct. Start with the object."
      - id: d
        text: "The Git history."
        explanation: "Not correct. Read the cluster state first."
    correct_option: b
    explanation: "Correct. They are the operator's own summary."

  - id: ats111-final-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Restore in order"
    source_readings:
      - sections/section-050/module-01/course-02-back-up-and-restore-perses-data.md
    prompt: "In which order do you restore a project and its dashboards through the API?"
    options:
      - id: a
        text: "The dashboards first."
        explanation: "Not correct. The server refuses them."
      - id: b
        text: "Both at once as one list."
        explanation: "Not correct. The API takes one object at a time."
      - id: c
        text: "The project first, then each dashboard."
        explanation: "Correct. A dashboard needs its project."
      - id: d
        text: "The order does not matter."
        explanation: "Not correct. It does."
    correct_option: c
    explanation: "Correct. A dashboard needs its project."

  - id: ats111-final-q27
    type: single_choice
    difficulty: advanced
    learning_objective: "Order an upgrade"
    source_readings:
      - sections/section-050/module-01/course-03-change-and-upgrade-safely.md
    prompt: "What is the order of an operator upgrade?"
    options:
      - id: a
        text: "The operator first, then the definitions."
