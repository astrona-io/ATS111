# Starting state of the capstone: a Perses resource with two faults.
# The operator names the Deployment and the Service after this object, so the
# server answers at http://perses.perses:8080 inside the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: perses
---
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: perses
  namespace: perses
  labels:
    app.kubernetes.io/instance: perses
spec:
  image: docker.io/persesdev/perses:v0.54.0
  containerPort: 8080
  config:
    database:
      file:
        folder: /perses
        extension: yaml
  storage:
    emptyDir: {}
  service:
    name: perses-ui
  resources:
    requests:
      memory: 16Mi
    limits:
      memory: 16Mi
