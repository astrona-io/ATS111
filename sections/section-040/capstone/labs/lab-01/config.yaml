# Lock Down Two Tenants Delivered By Flux
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-111-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-perses-operator"
      description: "Installs Helm, percli, Flux, the Perses Operator 0.5.0, a Perses server, Gitea with gitops/fleet, the Flux controllers and the team ServiceAccounts"
      type: "file"
      source: "bootstrap/01-install-perses-operator.sh"
    - name: "ats-111-capstone-040-setup"
      description: "Creates team Flux Kustomizations with a missing impersonation and a missing RoleBinding, a cluster-admin binding, and a cross-namespace dashboard in the catalog folder"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus and the tester pod in the namespace observability."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until the operator and the Perses server answer"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-impersonation"
      description: "Confirms each team Flux Kustomization acts as its team ServiceAccount and is Ready"
      type: "file"
      source: "validation/validate-impersonation.sh"
    - name: "validate-no-cluster-wide-binding"
      description: "Confirms no ClusterRoleBinding names a team ServiceAccount"
      type: "file"
      source: "validation/validate-no-cluster-wide-binding.sh"
    - name: "validate-permission-matrix"
      description: "Confirms each team can edit Perses resources in its own namespace only"
      type: "file"
      source: "validation/validate-permission-matrix.sh"
    - name: "validate-dashboards"
      description: "Confirms each team's dashboard is in Perses and the cross-namespace dashboard is gone"
      type: "file"
      source: "validation/validate-dashboards.sh"

teardown:
  keepCluster: false
