# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats111-040
course_id: ATS111
exam_code: PERSES
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Multi-Tenant Isolation"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats111-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how RBAC grants rights"
    source_readings:
      - sections/section-040/module-01/course-01-rbac-for-perses-resources.md
    prompt: "What does RBAC do when a ServiceAccount has no Role?"
    options:
      - id: a
        text: "It denies the ServiceAccount with an explicit deny rule."
        explanation: "Not correct. RBAC has no deny rules."
      - id: b
        text: "It gives the ServiceAccount the rights of its namespace."
        explanation: "Not correct. A namespace grants no rights by itself."
      - id: c
        text: "It gives the ServiceAccount read access to every namespace."
        explanation: "Not correct. No such default exists."
      - id: d
        text: "The ServiceAccount has no rights beyond basic API discovery, because RBAC only adds rights."
        explanation: "Correct. There are no rules that deny."
    correct_option: d
    explanation: "Correct. There are no rules that deny."

  - id: ats111-040-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a Role for Perses objects"
    source_readings:
      - sections/section-040/module-01/course-01-rbac-for-perses-resources.md
    prompt: "Which rule gives a team the right to deliver dashboards?"
    options:
      - id: a
        text: "The same verbs with `apiGroups: [\"\"]`."
        explanation: "Not correct. The core group does not hold Perses kinds, so the rule grants nothing."
      - id: b
        text: "Verbs on `persesdashboards` and `persesdatasources` with `apiGroups: [\"perses.dev\"]`, in a Role in the team namespace."
        explanation: "Correct. The API group must match."
      - id: c
        text: "A ClusterRole bound with a ClusterRoleBinding."
        explanation: "Not correct. That gives the same rights in every namespace."
      - id: d
        text: "The verb `*` on `perses`."
        explanation: "Not correct. That would also allow changing the server for everyone."
    correct_option: b
    explanation: "Correct. The API group must match."

  - id: ats111-040-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Check a permission"
    source_readings:
      - sections/section-040/module-01/course-01-rbac-for-perses-resources.md
    prompt: "Which command checks whether `payments-ci` may create dashboards in `payments`?"
    options:
      - id: a
        text: "`kubectl get rolebinding -n payments`"
        explanation: "Not correct. It lists bindings but does not evaluate the answer."
      - id: b
        text: "`kubectl describe serviceaccount payments-ci`"
        explanation: "Not correct. It does not show the effective rights."
      - id: c
        text: "`kubectl auth can-i create persesdashboards.perses.dev -n payments --as system:serviceaccount:payments:payments-ci`"
        explanation: "Correct. `--as` impersonates the ServiceAccount."
      - id: d
        text: "`kubectl apply --dry-run`"
        explanation: "Not correct. It does not test another identity."
    correct_option: c
    explanation: "Correct. `--as` impersonates the ServiceAccount."

  - id: ats111-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why some kinds stay with the platform team"
    source_readings:
      - sections/section-040/module-01/course-01-rbac-for-perses-resources.md
    prompt: "Why does `PersesGlobalDatasource` stay with the platform team?"
    options:
      - id: a
        text: "It is cluster-scoped and appears in every Perses project."
        explanation: "Correct. A namespace-bound team must not write it."
      - id: b
        text: "It can only be created by the operator."
        explanation: "Not correct. Users create it, like any custom resource."
      - id: c
        text: "It has no API group."
        explanation: "Not correct. It is in the group `perses.dev`."
      - id: d
        text: "It is not a Kubernetes object."
        explanation: "Not correct. It is a custom resource."
    correct_option: a
    explanation: "Correct. A namespace-bound team must not write it."

  - id: ats111-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the risk of rolebindings"
    source_readings:
      - sections/section-040/module-01/course-01-rbac-for-perses-resources.md
    prompt: "Why must a team not get the right to write RoleBindings?"
    options:
      - id: a
        text: "RoleBindings slow down the API server."
        explanation: "Not correct. Speed is not the reason."
      - id: b
        text: "RoleBindings are only valid for users, not ServiceAccounts."
        explanation: "Not correct. A RoleBinding accepts ServiceAccounts."
      - id: c
        text: "The operator would delete the team's dashboards."
        explanation: "Not correct. The operator does not react to RoleBindings."
      - id: d
        text: "A team that can write RoleBindings can give itself any right it can reach."
        explanation: "Correct. That breaks the isolation."
    correct_option: d
    explanation: "Correct. That breaks the isolation."

  - id: ats111-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make a pipeline act as a team"
    source_readings:
      - sections/section-040/module-01/course-02-tenant-pipelines-and-perses-authorization.md
    prompt: "Which field makes a Flux `Kustomization` apply as a ServiceAccount?"
    options:
      - id: a
        text: "`spec.serviceAccountName`"
        explanation: "Correct. Kustomize-controller impersonates it for every apply and prune."
      - id: b
        text: "`spec.sourceRef`"
        explanation: "Not correct. It names the source, not the identity."
      - id: c
        text: "`spec.targetNamespace`"
        explanation: "Not correct. It sets a namespace, not an identity."
      - id: d
        text: "`spec.prune`"
        explanation: "Not correct. It controls deletion."
    correct_option: a
    explanation: "Correct. Kustomize-controller impersonates it for every apply and prune."

  - id: ats111-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place the team Kustomization"
    source_readings:
      - sections/section-040/module-01/course-02-tenant-pipelines-and-perses-authorization.md
    prompt: "In which namespace does a team `Kustomization` with `serviceAccountName: catalog-ci` live?"
    options:
      - id: a
        text: "In `flux-system`, with the controllers."
        explanation: "Not correct. Flux would not find the ServiceAccount there."
      - id: b
        text: "In the team's namespace, `catalog`, because Flux looks up the ServiceAccount in the namespace of the `Kustomization`."
        explanation: "Correct. The ServiceAccount must be in the same namespace."
      - id: c
        text: "In `perses`, next to the server."
        explanation: "Not correct. The ServiceAccount is not in that namespace."
      - id: d
        text: "In any namespace, because the lookup is cluster-wide."
        explanation: "Not correct. The lookup uses the namespace of the `Kustomization`."
    correct_option: b
    explanation: "Correct. The ServiceAccount must be in the same namespace."

  - id: ats111-040-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict a cross-namespace file"
    source_readings:
      - sections/section-040/module-01/course-02-tenant-pipelines-and-perses-authorization.md
    prompt: "A file in the folder of `catalog` names the namespace `payments`, and the `Kustomization` acts as `catalog-ci`. What happens?"
    options:
      - id: a
        text: "The dashboard is created in `payments`."
        explanation: "Not correct. The ServiceAccount has no rights there."
      - id: b
        text: "Flux silently ignores the file."
        explanation: "Not correct. Flux reports the error on the `Kustomization`."
      - id: c
        text: "The apply fails with `Forbidden`, the `Kustomization` is not ready, and nothing in `payments` changes."
        explanation: "Correct. The team's Git folder can only do what the ServiceAccount can do."
      - id: d
        text: "The operator copies it into the project `catalog`."
        explanation: "Not correct. The object is never created."
    correct_option: c
    explanation: "Correct. The team's Git folder can only do what the ServiceAccount can do."

  - id: ats111-040-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the lockdown flags"
    source_readings:
      - sections/section-040/module-01/course-02-tenant-pipelines-and-perses-authorization.md
    prompt: "Which flag makes a `Kustomization` without `serviceAccountName` impersonate a default account?"
    options:
      - id: a
        text: "`--no-cross-namespace-refs=true`"
        explanation: "Not correct. It stops references to sources in other namespaces."
      - id: b
        text: "`--no-remote-bases=true`"
        explanation: "Not correct. It stops remote Kustomize bases."
      - id: c
        text: "`--default-service-account=<name>`"
        explanation: "Correct. It is set on kustomize-controller and helm-controller."
      - id: d
        text: "`--watch-all-namespaces=false`"
        explanation: "Not correct. It is not a lockdown flag for impersonation."
    correct_option: c
    explanation: "Correct. It is set on kustomize-controller and helm-controller."

  - id: ats111-040-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain Perses authentication and the operator"
    source_readings:
      - sections/section-040/module-01/course-02-tenant-pipelines-and-perses-authorization.md
    prompt: "You turn on `security.enable_auth: true` in the server configuration. What else must you configure?"
    options:
      - id: a
        text: "`spec.client` on the `Perses` resource, so the operator can log in."
        explanation: "Correct. Without it the operator cannot write to the server."
      - id: b
        text: "Nothing, because the operator uses the Kubernetes RBAC rules."
        explanation: "Not correct. Kubernetes RBAC does not log the operator in to Perses."
      - id: c
        text: "A ClusterRoleBinding for each team."
        explanation: "Not correct. Perses roles are separate from Kubernetes RBAC."
      - id: d
        text: "A new `PersesGlobalDatasource`."
        explanation: "Not correct. A datasource does not carry the operator's login."
    correct_option: a
    explanation: "Correct. Without it the operator cannot write to the server."


  - id: ats111-040-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Write a quota key"
    source_readings:
      - sections/section-040/module-02/course-01-cap-what-a-team-can-create.md
    prompt: "Which key caps the number of `PersesDashboard` objects in a namespace?"
    options:
      - id: a
        text: "`persesdashboards`"
        explanation: "Not correct. A group is needed."
      - id: b
        text: "`count/dashboards`"
        explanation: "Not correct. The resource and group are needed."
      - id: c
        text: "`limits.persesdashboards`"
        explanation: "Not correct. That form is for compute resources."
      - id: d
        text: "`count/persesdashboards.perses.dev`"
        explanation: "Correct. The form is `count/<resource>.<group>`."
    correct_option: d
    explanation: "Correct. The form is `count/<resource>.<group>`."

  - id: ats111-040-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a quota"
    source_readings:
      - sections/section-040/module-02/course-01-cap-what-a-team-can-create.md
    prompt: "A namespace is over its quota of dashboards. What does the quota do?"
    options:
      - id: a
        text: "It refuses new objects and removes none."
        explanation: "Correct. Quotas only stop creation."
      - id: b
        text: "It deletes the oldest dashboard."
        explanation: "Not correct. Nothing is deleted."
      - id: c
        text: "It stops the Perses server."
        explanation: "Not correct. The server is untouched."
      - id: d
        text: "It warns and accepts the object."
        explanation: "Not correct. The object is refused."
    correct_option: a
    explanation: "Correct. Quotas only stop creation."

  - id: ats111-040-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a quota failure"
    source_readings:
      - sections/section-040/module-02/course-01-cap-what-a-team-can-create.md
    prompt: "How does a refused dashboard show up in a Flux delivery?"
    options:
      - id: a
        text: "As a Perses `ValidationFailed` condition."
        explanation: "Not correct. Perses never saw it."
      - id: b
        text: "As an `exceeded quota` message in the Kustomization."
        explanation: "Correct. The API server's answer is passed on."
      - id: c
        text: "As a missing GitRepository."
        explanation: "Not correct. The source is fine."
      - id: d
        text: "It is silent."
        explanation: "Not correct. The message is shown."
    correct_option: b
    explanation: "Correct. The API server's answer is passed on."

  - id: ats111-040-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name who needs access"
    source_readings:
      - sections/section-040/module-02/course-02-restrict-who-can-call-the-server.md
    prompt: "A NetworkPolicy limits calls to the Perses server. Which namespace must be allowed?"
    options:
      - id: a
        text: "Only the team namespaces."
        explanation: "Not correct. The operator would be blocked."
      - id: b
        text: "`kube-system` only."
        explanation: "Not correct. It is unrelated."
      - id: c
        text: "The namespace of the operator, or delivery stops."
        explanation: "Correct. The operator calls the server API."
      - id: d
        text: "No namespace. Policies never block the operator."
        explanation: "Not correct. They do."
    correct_option: c
    explanation: "Correct. The operator calls the server API."

  - id: ats111-040-q15
    type: single_choice
    difficulty: advanced
    learning_objective: "Test a policy"
    source_readings:
      - sections/section-040/module-02/course-02-restrict-who-can-call-the-server.md
    prompt: "Why test a NetworkPolicy with a pod that should be refused?"
    options:
      - id: a
        text: "Policies always work on every cluster."
        explanation: "Not correct. Some plugins ignore them."
      - id: b
        text: "It is faster than reading the policy."
        explanation: "Not correct. The reason is enforcement."
      - id: c
        text: "Because the operator tests it itself."
        explanation: "Not correct. It does not."
      - id: d
        text: "A policy has an effect only when the network plugin enforces it."
        explanation: "Correct. A policy object alone proves nothing."
    correct_option: d
    explanation: "Correct. A policy object alone proves nothing."

  - id: ats111-040-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Match a namespace"
    source_readings:
      - sections/section-040/module-02/course-02-restrict-who-can-call-the-server.md
    prompt: "Which label does a NetworkPolicy use to select a namespace by name?"
    options:
      - id: a
        text: "`kubernetes.io/metadata.name`"
        explanation: "Correct. Kubernetes sets it on every namespace."
      - id: b
        text: "`name`"
        explanation: "Not correct. It is not set by default."
      - id: c
        text: "`app.kubernetes.io/name`"
        explanation: "Not correct. That labels workloads."
      - id: d
        text: "`perses.dev/project`"
        explanation: "Not correct. That is not a namespace label."
    correct_option: a
    explanation: "Correct. Kubernetes sets it on every namespace."

  - id: ats111-040-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Understand read-only mode"
    source_readings:
      - sections/section-040/module-02/course-03-read-only-mode-and-server-authentication.md
    prompt: "What does a read-only Perses server do with writes from the operator?"
    options:
      - id: a
        text: "It accepts them because the operator is trusted."
        explanation: "Not correct. Everyone is refused."
      - id: b
        text: "It refuses them, so a managed server cannot be read-only."
        explanation: "Correct. Read-only refuses every write."
      - id: c
        text: "It queues them."
        explanation: "Not correct. Nothing is queued."
      - id: d
        text: "It accepts only dashboards."
        explanation: "Not correct. All writes are refused."
    correct_option: b
    explanation: "Correct. Read-only refuses every write."

  - id: ats111-040-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Give the operator credentials"
    source_readings:
      - sections/section-040/module-02/course-03-read-only-mode-and-server-authentication.md
    prompt: "Authentication is on. What does the operator need?"
    options:
      - id: a
        text: "A cluster-admin binding."
        explanation: "Not correct. The server does not use Kubernetes roles."
      - id: b
        text: "Nothing. The operator is exempt."
        explanation: "Not correct. It must log in."
      - id: c
        text: "Credentials in `spec.client` on the `Perses` resource."
        explanation: "Correct. Fields are found with `kubectl explain`."
      - id: d
        text: "A second Perses server."
        explanation: "Not correct. That does not help."
    correct_option: c
    explanation: "Correct. Fields are found with `kubectl explain`."

  - id: ats111-040-q19
    type: single_choice
    difficulty: beginner
    learning_objective: "Inspect the operator"
    source_readings:
      - sections/section-040/module-02/course-04-least-privilege-for-the-operator.md
    prompt: "Which command checks what a ServiceAccount may do?"
    options:
      - id: a
        text: "`kubectl get rolebinding`"
        explanation: "Not correct. It lists bindings only."
      - id: b
        text: "`kubectl describe perses`"
        explanation: "Not correct. It does not show rights."
      - id: c
        text: "`kubectl top sa`"
        explanation: "Not correct. No such command."
      - id: d
        text: "`kubectl auth can-i <verb> <resource> --as system:serviceaccount:<ns>:<name>`"
        explanation: "Correct. It asks the API server with that identity."
    correct_option: d
    explanation: "Correct. It asks the API server with that identity."

  - id: ats111-040-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Review the operator ClusterRole"
    source_readings:
      - sections/section-040/module-02/course-04-least-privilege-for-the-operator.md
    prompt: "Why print the rules of a role instead of reading its name?"
    options:
      - id: a
        text: "The name tells little. The rules show the verbs and resources it grants."
        explanation: "Correct. Names can be misleading."
      - id: b
        text: "Names are always exact."
        explanation: "Not correct. They are free text."
      - id: c
        text: "Rules are encrypted."
        explanation: "Not correct. They are plain."
      - id: d
        text: "Roles have no rules."
        explanation: "Not correct. Rules are their content."
    correct_option: a
    explanation: "Correct. Names can be misleading."
