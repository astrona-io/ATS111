apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ops-datasources
  namespace: flux-system
spec:
  interval: 5m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: fleet
  path: ./ops/datasources
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: perses
      namespace: perses
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ops-dashboards
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: ops-datasources
  sourceRef:
    kind: GitRepository
    name: fleet
  path: ./ops/dashboards
  prune: true
