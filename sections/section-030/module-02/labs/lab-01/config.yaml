# Deliver An Ordered, Parameterised Ops Pipeline
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-111-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses-operator"
      description: "Installs Helm, percli, Prometheus, the tester pod and the Perses Operator 0.5.0"
      type: "file"
      source: "bootstrap/01-install-perses-operator.sh"
    - name: "ats-111-lab-030-02-setup"
      description: "Creates the Git credentials, the source fleet and the ConfigMap platform-vars"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus and the tester pod in the namespace observability."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until the operator and the Perses server answer"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-flux-ready"
      description: "The source fleet and both Kustomizations are Ready"
      type: "file"
      source: "validation/validate-flux-ready.sh"
    - name: "validate-dependency"
      description: "ops-dashboards depends on ops-datasources and both prune"
      type: "file"
      source: "validation/validate-dependency.sh"
    - name: "validate-substitution-and-health"
      description: "ops-datasources substitutes from platform-vars and checks the Perses Deployment"
      type: "file"
      source: "validation/validate-substitution-and-health.sh"
    - name: "validate-datasource-address"
      description: "The datasource ops-prometheus is Available with the address from the ConfigMap"
      type: "file"
      source: "validation/validate-datasource-address.sh"
    - name: "validate-dashboard-served"
      description: "The dashboard payments-ops is Available and served by Perses"
      type: "file"
      source: "validation/validate-dashboard-served.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
