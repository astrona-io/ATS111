apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments
namePrefix: payments-
resources:
  - ../../base/service-health
patches:
  - target:
      kind: PersesDashboard
      name: service-health
    patch: |-
      - op: replace
        path: /spec/config/display/name
        value: Payments Service Health
