# Reconcile Dashboards From Git
# Playground: a sandbox that spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-111-playground-030-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm, percli and Flux, the Perses Operator 0.5.0, a Perses server, Prometheus, Gitea with the repository gitops/fleet and the Flux controllers."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus and the tester pod in the namespace observability."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
