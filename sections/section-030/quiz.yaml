# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats111-030
course_id: ATS111
exam_code: PERSES
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "GitOps For Dashboards With Flux"
placement:
  position: after
  reading: sections/section-030/capstone/labs/lab-01/question.md
questions:
  - id: ats111-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain the split between Flux and the operator"
    source_readings:
      - sections/section-030/module-01/course-01-dashboards-in-git.md
    prompt: "Which sentence describes the two controllers correctly?"
    options:
      - id: a
        text: "Flux writes dashboards into Perses, and the operator reads Git."
        explanation: "Not correct. Flux does not talk to Perses, and the operator does not read Git."
      - id: b
        text: "The operator pulls Git, and Flux creates the Perses project."
        explanation: "Not correct. Each controller stays in its own half of the chain."
      - id: c
        text: "Flux makes the cluster match Git, and the operator makes Perses match the cluster."
        explanation: "Correct. Flux never talks to Perses, and the operator never reads Git."
      - id: d
        text: "Flux and the operator both read Git and both call the Perses API."
        explanation: "Not correct. Only the operator calls the Perses API."
    correct_option: c
    explanation: "Correct. Flux never talks to Perses, and the operator never reads Git."

  - id: ats111-030-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Lay out a dashboards repository"
    source_readings:
      - sections/section-030/module-01/course-01-dashboards-in-git.md
    prompt: "What does the folder of one team in the repository hold?"
    options:
      - id: a
        text: "The team's `PersesDatasource` and `PersesDashboard` files, and no `Namespace` objects."
        explanation: "Correct. The platform creates the namespaces."
      - id: b
        text: "The team's `Namespace` and `Perses` objects."
        explanation: "Not correct. Namespaces and the server stay with the platform."
      - id: c
        text: "A Flux `Kustomization` for every other team."
        explanation: "Not correct. A team folder holds only what the team owns."
      - id: d
        text: "The Perses database files of the team."
        explanation: "Not correct. Perses stores its own data, not Git."
    correct_option: a
    explanation: "Correct. The platform creates the namespaces."

  - id: ats111-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell the two Kustomizations apart"
    source_readings:
      - sections/section-030/module-01/course-01-dashboards-in-git.md
    prompt: "What is the difference between the Flux `Kustomization` and `kustomization.yaml`?"
    options:
      - id: a
        text: "They are the same file with two names."
        explanation: "Not correct. One is a cluster object, the other a file in Git."
      - id: b
        text: "The first is a Flux object in the cluster, and the second is an optional Kustomize file in the folder."
        explanation: "Correct. They have similar names and different jobs."
      - id: c
        text: "The Flux object lives in Git, and the file lives in the cluster."
        explanation: "Not correct. It is the other way round."
      - id: d
        text: "The Flux object is only used with Argo CD."
        explanation: "Not correct. It belongs to Flux."
    correct_option: b
    explanation: "Correct. They have similar names and different jobs."

  - id: ats111-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply a change on demand"
    source_readings:
      - sections/section-030/module-01/course-01-dashboards-in-git.md
    prompt: "How do you fetch and apply a new commit now instead of waiting?"
    options:
      - id: a
        text: "`kubectl rollout restart deployment/perses`"
        explanation: "Not correct. Restarting Perses does not fetch Git."
      - id: b
        text: "`git push --force`"
        explanation: "Not correct. A push only changes Git."
      - id: c
        text: "`kubectl delete gitrepository fleet`"
        explanation: "Not correct. That removes the source instead of refreshing it."
      - id: d
        text: "`flux reconcile kustomization <name> --with-source`"
        explanation: "Correct. It fetches the source and runs the apply."
    correct_option: d
    explanation: "Correct. It fetches the source and runs the apply."

  - id: ats111-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict who corrects a hand edit of the object"
    source_readings:
      - sections/section-030/module-01/course-02-drift-pruning-and-the-operator.md
    prompt: "Someone edits a `PersesDashboard` object with `kubectl patch`. Who corrects it, and when?"
    options:
      - id: a
        text: "Kustomize-controller, on the next run of the Flux `Kustomization`, because server-side apply puts back every field Git sets."
        explanation: "Correct. In this course that run is at most five minutes later."
      - id: b
        text: "The Perses Operator, immediately."
        explanation: "Not correct. The operator copies the edit into Perses."
      - id: c
        text: "Nobody, because Flux only applies new commits."
        explanation: "Not correct. Flux applies the folder on every run."
      - id: d
        text: "Source-controller, when it fetches the repository."
        explanation: "Not correct. Source-controller only fetches."
    correct_option: a
    explanation: "Correct. In this course that run is at most five minutes later."

  - id: ats111-030-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict who corrects an edit made in Perses"
    source_readings:
      - sections/section-030/module-01/course-02-drift-pruning-and-the-operator.md
    prompt: "Someone edits a dashboard title in the Perses user interface. Why does Flux not fix it?"
    options:
      - id: a
        text: "Flux does not support dashboards."
        explanation: "Not correct. Flux applies any Kubernetes object."
      - id: b
        text: "Flux only checks Perses once a day."
        explanation: "Not correct. Flux never checks Perses."
      - id: c
        text: "The object in the cluster still matches Git, so Flux sees no difference."
        explanation: "Correct. Only a reconciliation of the object by the operator writes the object back."
      - id: d
        text: "The edit is saved in Git automatically."
        explanation: "Not correct. Perses never writes to Git."
    correct_option: c
    explanation: "Correct. Only a reconciliation of the object by the operator writes the object back."

  - id: ats111-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Trigger the operator on demand"
    source_readings:
      - sections/section-030/module-01/course-02-drift-pruning-and-the-operator.md
    prompt: "What starts a reconciliation of a `PersesDashboard` object on demand?"
    options:
      - id: a
        text: "`flux reconcile kustomization` when Git did not change."
        explanation: "Not correct. Flux changes nothing when the object matches Git."
      - id: b
        text: "Restarting the Gitea pod."
        explanation: "Not correct. Gitea is not part of the operator's loop."
      - id: c
        text: "Deleting the project in Perses."
        explanation: "Not correct. That does not touch the object."
      - id: d
        text: "Any change to the object, such as adding an annotation."
        explanation: "Correct. The operator then writes the object's version back to Perses."
    correct_option: d
    explanation: "Correct. The operator then writes the object's version back to Perses."

  - id: ats111-030-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain pruning"
    source_readings:
      - sections/section-030/module-01/course-02-drift-pruning-and-the-operator.md
    prompt: "What does pruning do?"
    options:
      - id: a
        text: "It deletes objects that Flux never applied."
        explanation: "Not correct. Pruning only uses the inventory."
      - id: b
        text: "It deletes objects that Flux applied before and that are no longer in Git."
        explanation: "Correct. Flux uses the inventory in the `Kustomization` status."
      - id: c
        text: "It removes old commits from Git."
        explanation: "Not correct. Pruning acts on the cluster."
      - id: d
        text: "It deletes the Perses project when it is empty."
        explanation: "Not correct. The operator never deletes projects."
    correct_option: b
    explanation: "Correct. Flux uses the inventory in the `Kustomization` status."

  - id: ats111-030-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Know the effect of prune false"
    source_readings:
      - sections/section-030/module-01/course-02-drift-pruning-and-the-operator.md
    prompt: "A file is removed from Git while `prune: false`. Later you set `prune: true`. What happens to the dashboard?"
    options:
      - id: a
        text: "Flux deletes it on the next run."
        explanation: "Not correct. The inventory no longer lists it."
      - id: b
        text: "It stays in the cluster and in Perses until someone deletes it by hand."
        explanation: "Correct. It dropped out of the inventory without being deleted."
      - id: c
        text: "The operator deletes it from Perses."
        explanation: "Not correct. The object still exists, so the operator keeps the dashboard."
      - id: d
        text: "Flux marks the `Kustomization` as failed."
        explanation: "Not correct. Flux reports no error for an orphan."
    correct_option: b
    explanation: "Correct. It dropped out of the inventory without being deleted."

  - id: ats111-030-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read what a ready Kustomization proves"
    source_readings:
      - sections/section-030/module-01/course-02-drift-pruning-and-the-operator.md
    prompt: "What does a ready Flux `Kustomization` prove?"
    options:
      - id: a
        text: "The objects are in the cluster. The object's conditions show whether they reached Perses."
        explanation: "Correct. Flux is done once the custom resource is correct in the cluster."
      - id: b
        text: "The dashboards are served by Perses."
        explanation: "Not correct. Only the conditions of the object and a Perses request prove that."
      - id: c
        text: "The operator reconciled every object."
        explanation: "Not correct. Flux does not see the operator."
      - id: d
        text: "Pruning is switched on."
        explanation: "Not correct. Pruning is a separate field."
    correct_option: a
    explanation: "Correct. Flux is done once the custom resource is correct in the cluster."


  - id: ats111-030-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Order deliveries"
    source_readings:
      - sections/section-030/module-02/course-01-order-and-health.md
    prompt: "What does `dependsOn` on a Flux `Kustomization` do?"
    options:
      - id: a
        text: "It applies the listed Kustomizations first by itself."
        explanation: "Not correct. It only waits."
      - id: b
        text: "It copies their files into its own path."
        explanation: "Not correct. Each keeps its own path."
      - id: c
        text: "It fixes failing health checks."
        explanation: "Not correct. It does not repair anything."
      - id: d
        text: "It waits until the listed Kustomizations are `Ready` before it applies."
        explanation: "Correct. Without it there is no order."
    correct_option: d
    explanation: "Correct. Without it there is no order."

  - id: ats111-030-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a blocked delivery"
    source_readings:
      - sections/section-030/module-02/course-01-order-and-health.md
    prompt: "A delivery is blocked by `dependsOn`. What does it do?"
    options:
      - id: a
        text: "It applies nothing new and deletes nothing, and tries again at its next interval."
        explanation: "Correct. A block only holds back new work."
      - id: b
        text: "It deletes the objects it applied before."
        explanation: "Not correct. Nothing is deleted."
      - id: c
        text: "It applies anyway after one minute."
        explanation: "Not correct. It keeps waiting."
      - id: d
        text: "It turns itself off."
        explanation: "Not correct. It stays active and retries."
    correct_option: a
    explanation: "Correct. A block only holds back new work."

  - id: ats111-030-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Define healthy"
    source_readings:
      - sections/section-030/module-02/course-01-order-and-health.md
    prompt: "What does `Ready` mean on a Kustomization with no `wait` and no `healthChecks`?"
    options:
      - id: a
        text: "Every object is `Available`."
        explanation: "Not correct. That needs `wait` or `healthChecks`."
      - id: b
        text: "The apply succeeded."
        explanation: "Correct. Health is only checked when you ask for it."
      - id: c
        text: "Perses accepted the dashboards."
        explanation: "Not correct. Perses is not asked."
      - id: d
        text: "The Git commit was reviewed."
        explanation: "Not correct. Flux does not review commits."
    correct_option: b
    explanation: "Correct. Health is only checked when you ask for it."

  - id: ats111-030-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Bound a health check"
    source_readings:
      - sections/section-030/module-02/course-01-order-and-health.md
    prompt: "Which field bounds how long Flux waits for the health checks?"
    options:
      - id: a
        text: "`interval`"
        explanation: "Not correct. It sets how often Flux reconciles."
      - id: b
        text: "`retryInterval`"
        explanation: "Not correct. It sets the wait after a failure."
      - id: c
        text: "`timeout`"
        explanation: "Correct. It limits the wait."
      - id: d
        text: "`prune`"
        explanation: "Not correct. It controls removal of objects."
    correct_option: c
    explanation: "Correct. It limits the wait."

  - id: ats111-030-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Use overlays"
    source_readings:
      - sections/section-030/module-02/course-02-overlays-with-kustomize.md
    prompt: "What should an overlay change?"
    options:
      - id: a
        text: "The whole base, copied."
        explanation: "Not correct. That removes the shared source."
      - id: b
        text: "The Flux controllers."
        explanation: "Not correct. Overlays do not touch Flux."
      - id: c
        text: "The CRDs of the operator."
        explanation: "Not correct. They are not in the overlay."
      - id: d
        text: "Values such as the namespace, a prefix, labels or a small patch."
        explanation: "Correct. The base keeps the shared content."
    correct_option: d
    explanation: "Correct. The base keeps the shared content."

  - id: ats111-030-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Preview a build"
    source_readings:
      - sections/section-030/module-02/course-02-overlays-with-kustomize.md
    prompt: "Which command shows the output of an overlay without a cluster?"
    options:
      - id: a
        text: "`kubectl kustomize <folder>`"
        explanation: "Correct. It builds and prints the objects."
      - id: b
        text: "`flux reconcile <folder>`"
        explanation: "Not correct. That needs a cluster."
      - id: c
        text: "`kubectl get kustomize`"
        explanation: "Not correct. That is not a resource."
      - id: d
        text: "`helm template <folder>`"
        explanation: "Not correct. That is for Helm charts."
    correct_option: a
    explanation: "Correct. It builds and prints the objects."

  - id: ats111-030-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what adding a file changes"
    source_readings:
      - sections/section-030/module-02/course-02-overlays-with-kustomize.md
    prompt: "You add a `kustomization.yaml` to a folder that Flux applies. What changes?"
    options:
      - id: a
        text: "Nothing, because Flux ignores the file."
        explanation: "Not correct. Flux builds with it."
      - id: b
        text: "Flux applies only the files the new file lists."
        explanation: "Correct. Without the file Flux applies every YAML file."
      - id: c
        text: "Flux applies the files twice."
        explanation: "Not correct. Each is applied once."
      - id: d
        text: "Flux stops with an error."
        explanation: "Not correct. The file is valid."
    correct_option: b
    explanation: "Correct. Without the file Flux applies every YAML file."

  - id: ats111-030-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place a substitution"
    source_readings:
      - sections/section-030/module-02/course-03-variables-from-the-cluster.md
    prompt: "Where does `postBuild.substituteFrom` look for the ConfigMap?"
    options:
      - id: a
        text: "In the namespace of the Perses server."
        explanation: "Not correct. It does not look there."
      - id: b
        text: "In every namespace."
        explanation: "Not correct. It reads one namespace."
      - id: c
        text: "In the namespace of the Flux `Kustomization`."
        explanation: "Correct. The reference has no namespace field."
      - id: d
        text: "In the Git repository."
        explanation: "Not correct. It reads the cluster."
    correct_option: c
    explanation: "Correct. The reference has no namespace field."

  - id: ats111-030-q19
    type: single_choice
    difficulty: advanced
    learning_objective: "Spot a hidden failure"
    source_readings:
      - sections/section-030/module-02/course-03-variables-from-the-cluster.md
    prompt: "A delivery is `Ready` but the dashboard is missing in Perses. What do you read next?"
    options:
      - id: a
        text: "Nothing. `Ready` means it works."
        explanation: "Not correct. It only means the apply succeeded."
      - id: b
        text: "Only the Flux log."
        explanation: "Not correct. Flux has no error to show."
      - id: c
        text: "The node events."
        explanation: "Not correct. They are unrelated."
      - id: d
        text: "The conditions of the Perses object, because Perses may refuse the content."
        explanation: "Correct. Flux does not check the Perses side."
    correct_option: d
    explanation: "Correct. Flux does not check the Perses side."

  - id: ats111-030-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Start at the source"
    source_readings:
      - sections/section-030/module-02/course-04-find-out-why-a-sync-is-stuck.md
    prompt: "Something in Git never arrives. Where does the search start?"
    options:
      - id: a
        text: "At the source: `flux get sources git`, then the Kustomization, then the Perses object."
        explanation: "Correct. Follow the chain in order."
      - id: b
        text: "At the Perses server log."
        explanation: "Not correct. That is the end of the chain."
      - id: c
        text: "At the operator log."
        explanation: "Not correct. Nothing has reached the operator yet."
      - id: d
        text: "By deleting the Kustomization."
        explanation: "Not correct. That destroys evidence."
    correct_option: a
    explanation: "Correct. Follow the chain in order."
