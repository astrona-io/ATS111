# Declare Dashboards And Datasources In Namespaces
# Playground: a sandbox that spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-111-playground-020-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm and percli, the Perses Operator 0.5.0, a Perses server, Prometheus, the tester pod and the empty namespaces payments and catalog."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus and the tester pod in the namespace observability."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
