apiVersion: v1
kind: Namespace
metadata:
  name: perses-staging
---
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: staging
  namespace: perses-staging
  labels:
    app.kubernetes.io/instance: staging
    env: staging
spec:
  image: docker.io/persesdev/perses:v0.54.0
  containerPort: 8080
  config:
    database:
      file:
        folder: /perses
        extension: yaml
  storage:
    emptyDir: {}
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
