apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: checkout
  namespace: payments
spec:
  instanceSelector:
    matchLabels:
      env: staging
  config:
    display:
      name: Checkout
    duration: 1h
    panels: {}
    layouts: []
---
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: prometheus
  namespace: payments
spec:
  instanceSelector:
    matchLabels:
      env: staging
  config:
    display:
      name: Prometheus
    default: true
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://prometheus.observability.svc.cluster.local:9090
            allowedEndpoints:
              - endpointPattern: /api/v1/query
                method: GET
              - endpointPattern: /api/v1/query_range
                method: GET
              - endpointPattern: /api/v1/labels
                method: GET
              - endpointPattern: /api/v1/label/([a-zA-Z0-9_-]+)/values
                method: GET
              - endpointPattern: /api/v1/series
                method: GET
