# Send A Dashboard To Staging And Limit Its Datasource
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-111-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-perses-operator"
      description: "Installs Helm, percli, Prometheus, the tester pod and the Perses Operator 0.5.0"
      type: "file"
      source: "bootstrap/01-install-perses-operator.sh"
    - name: "ats-111-lab-020-02-setup"
      description: "Starts the second Perses server staging (label env=staging) and leaves production unlabelled"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus and the tester pod in the namespace observability."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until the operator and the Perses server answer"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-labels"
      description: "The server perses has env=production and staging has env=staging"
      type: "file"
      source: "validation/validate-labels.sh"
    - name: "validate-conditions"
      description: "The dashboard checkout and the datasource prometheus are Available"
      type: "file"
      source: "validation/validate-conditions.sh"
    - name: "validate-routing"
      description: "Staging has the dashboard and the datasource, and production has no checkout dashboard"
      type: "file"
      source: "validation/validate-routing.sh"
    - name: "validate-datasource-query"
      description: "A query through the datasource on staging succeeds"
      type: "file"
      source: "validation/validate-datasource-query.sh"
    - name: "validate-allowed-endpoints"
      description: "The datasource lists exactly the five required paths"
      type: "file"
      source: "validation/validate-allowed-endpoints.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/persesdev/perses:v0.54.0
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
