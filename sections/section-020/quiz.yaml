# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats111-020
course_id: ATS111
exam_code: PERSES
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Dashboards And Datasources As Kubernetes Resources"
placement:
  position: after
  reading: sections/section-020/capstone/labs/lab-01/question.md
questions:
  - id: ats111-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how a namespace becomes a project"
    source_readings:
      - sections/section-020/module-01/course-01-datasources-as-custom-resources.md
    prompt: "Into which Perses project does the operator copy a `PersesDatasource` from the namespace `payments`?"
    options:
      - id: a
        text: "The project `default`."
        explanation: "Not correct. The operator uses the namespace name."
      - id: b
        text: "The project `payments`, created first if it is missing."
        explanation: "Correct. The namespace is the project."
      - id: c
        text: "A global datasource that every project sees."
        explanation: "Not correct. Only a `PersesGlobalDatasource` becomes a global datasource."
      - id: d
        text: "The project named after the `Perses` resource."
        explanation: "Not correct. The project comes from the namespace of the object."
    correct_option: b
    explanation: "Correct. The namespace is the project."

  - id: ats111-020-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the right URL for an HTTP proxy datasource"
    source_readings:
      - sections/section-020/module-01/course-01-datasources-as-custom-resources.md
    prompt: "A datasource uses an HTTP proxy to Prometheus. Which URL is right?"
    options:
      - id: a
        text: "The cluster address, for example `http://prometheus.observability.svc.cluster.local:9090`."
        explanation: "Correct. The Perses server sends the query, so the address must work inside the cluster."
      - id: b
        text: "An address that only works from your browser, such as `http://localhost:9090`."
        explanation: "Not correct. The browser does not call Prometheus with a proxy."
      - id: c
        text: "The address of the Perses Service."
        explanation: "Not correct. That would send the query back to Perses."
      - id: d
        text: "The address of the Perses Operator."
        explanation: "Not correct. The operator does not answer Prometheus queries."
    correct_option: a
    explanation: "Correct. The Perses server sends the query, so the address must work inside the cluster."

  - id: ats111-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Prove a datasource with a query"
    source_readings:
      - sections/section-020/module-01/course-01-datasources-as-custom-resources.md
    prompt: "Which check is the strongest proof that a datasource works?"
    options:
      - id: a
        text: "`Available=True` on the `PersesDatasource`."
        explanation: "Not correct. It proves the copy reached Perses, not that Prometheus answers."
      - id: b
        text: "A successful `kubectl apply`."
        explanation: "Not correct. It only proves the API server accepted the object."
      - id: c
        text: "The datasource in the list of the project."
        explanation: "Not correct. A datasource can exist and point at a wrong address."
      - id: d
        text: "A Prometheus API query through `/proxy/projects/<project>/datasources/<name>/`."
        explanation: "Correct. A dashboard panel uses the same path."
    correct_option: d
    explanation: "Correct. A dashboard panel uses the same path."

  - id: ats111-020-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the tags annotation"
    source_readings:
      - sections/section-020/module-01/course-01-datasources-as-custom-resources.md
    prompt: "What does the operator do with the annotation `perses.dev/tags` on a custom resource?"
    options:
      - id: a
        text: "It limits which servers receive the object."
        explanation: "Not correct. Only `instanceSelector` selects servers."
      - id: b
        text: "It sets the project of the object."
        explanation: "Not correct. The project comes from the namespace."
      - id: c
        text: "It lower-cases the values and stores them as Perses tags."
        explanation: "Correct. The user interface can filter on those tags."
      - id: d
        text: "It marks the object as read-only in Perses."
        explanation: "Not correct. The annotation has no effect on permissions."
    correct_option: c
    explanation: "Correct. The user interface can filter on those tags."

  - id: ats111-020-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what happens on delete"
    source_readings:
      - sections/section-020/module-01/course-02-dashboards-as-custom-resources.md
    prompt: "You delete a `PersesDashboard` object. What happens in Perses?"
    options:
      - id: a
        text: "The dashboard stays, because Perses owns it now."
        explanation: "Not correct. The object is the source of truth."
      - id: b
        text: "The dashboard is deleted from every server it was sent to, and the project stays."
        explanation: "Correct. The operator never deletes projects."
      - id: c
        text: "The dashboard and the project are both deleted."
        explanation: "Not correct. The operator never deletes a project."
      - id: d
        text: "The dashboard is hidden but kept in the database."
        explanation: "Not correct. The operator deletes it through the API."
    correct_option: b
    explanation: "Correct. The operator never deletes projects."

  - id: ats111-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what happens to edits made in Perses"
    source_readings:
      - sections/section-020/module-01/course-02-dashboards-as-custom-resources.md
    prompt: "You change a dashboard title in the Perses user interface. What happens at the next reconciliation of the object?"
    options:
      - id: a
        text: "The operator copies the change back into the object."
        explanation: "Not correct. The operator only writes from the object to Perses."
      - id: b
        text: "The object is marked `Degraded`."
        explanation: "Not correct. The operator reports no error for an edit made in Perses."
      - id: c
        text: "The change stays forever."
        explanation: "Not correct. The next reconciliation replaces it."
      - id: d
        text: "The operator overwrites the change with the content of the object."
        explanation: "Correct. The object is the source of truth."
    correct_option: d
    explanation: "Correct. The object is the source of truth."

  - id: ats111-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use instanceSelector"
    source_readings:
      - sections/section-020/module-01/course-02-dashboards-as-custom-resources.md
    prompt: "Which labels does `instanceSelector` read?"
    options:
      - id: a
        text: "The labels in `metadata.labels` of the `Perses` resource."
        explanation: "Correct. It matches the labels of the resource itself."
      - id: b
        text: "The labels in `spec.metadata.labels` of the `Perses` resource."
        explanation: "Not correct. Those labels go onto the pods and the Service."
      - id: c
        text: "The labels of the Perses pod."
        explanation: "Not correct. The selector looks at `Perses` resources, not pods."
      - id: d
        text: "The labels of the namespace of the dashboard."
        explanation: "Not correct. The selector matches servers, not namespaces."
    correct_option: a
    explanation: "Correct. It matches the labels of the resource itself."

  - id: ats111-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the PersesMissing reason"
    source_readings:
      - sections/section-020/module-01/course-02-dashboards-as-custom-resources.md
    prompt: "A `PersesDashboard` has the reason `PersesMissing`. What does it mean?"
    options:
      - id: a
        text: "The Perses server refused the dashboard."
        explanation: "Not correct. That is the reason `ValidationFailed`."
      - id: b
        text: "The operator cannot reach the server."
        explanation: "Not correct. That is the reason `PersesConnectionFailed`."
      - id: c
        text: "No `Perses` resource matches its `instanceSelector`, and the operator retries every minute."
        explanation: "Correct. The dashboard arrives when a matching server exists."
      - id: d
        text: "The project is missing and must be created by hand."
        explanation: "Not correct. The operator creates the project."
    correct_option: c
    explanation: "Correct. The dashboard arrives when a matching server exists."

  - id: ats111-020-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the ValidationFailed reason"
    source_readings:
      - sections/section-020/module-01/course-02-dashboards-as-custom-resources.md
    prompt: "A dashboard layout refers to a panel that does not exist. Which reason does the object show?"
    options:
      - id: a
        text: "`PersesMissing`"
        explanation: "Not correct. A server was found, so the reason is not about selection."
      - id: b
        text: "`Reconciled`"
        explanation: "Not correct. That reason belongs to a successful sync."
      - id: c
        text: "`ValidationFailed`, with the message of the Perses server."
        explanation: "Correct. The operator sent the dashboard and the server refused it."
      - id: d
        text: "`InvalidConfiguration`"
        explanation: "Not correct. That reason belongs to a `Perses` resource, not a dashboard."
    correct_option: c
    explanation: "Correct. The operator sent the dashboard and the server refused it."

  - id: ats111-020-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know where provisioning files must be mounted"
    source_readings:
      - sections/section-020/module-01/course-03-provisioning-without-the-operator.md
    prompt: "Where must you not mount extra volumes in a `Perses` resource?"
    options:
      - id: a
        text: "Under `/etc/perses/provisioning`."
        explanation: "Correct. The operator reserves that path for its own provisioning Secrets."
      - id: b
        text: "Under `/etc/perses/provisioned`."
        explanation: "Not correct. That path is free to use."
      - id: c
        text: "Under `/etc/perses/notes`."
        explanation: "Not correct. Any path outside the reserved one is allowed."
      - id: d
        text: "Under `/perses`."
        explanation: "Not correct. That is the database folder of the example, not a reserved path."
    correct_option: a
    explanation: "Correct. The operator reserves that path for its own provisioning Secrets."


  - id: ats111-020-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a selector reads"
    source_readings:
      - sections/section-020/module-02/course-01-several-servers-and-selectors.md
    prompt: "Which labels does `instanceSelector` match?"
    options:
      - id: a
        text: "The labels of the dashboard itself."
        explanation: "Not correct. That would match nothing useful."
      - id: b
        text: "The labels of the namespace of the dashboard."
        explanation: "Not correct. Namespace labels are not used."
      - id: c
        text: "The labels of the pods of the server."
        explanation: "Not correct. Pod labels are set by `spec.metadata`."
      - id: d
        text: "The labels in the `metadata.labels` of the `Perses` resources."
        explanation: "Correct. The selector chooses among servers."
    correct_option: d
    explanation: "Correct. The selector chooses among servers."

  - id: ats111-020-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Use matchLabels"
    source_readings:
      - sections/section-020/module-02/course-01-several-servers-and-selectors.md
    prompt: "A selector lists two pairs under `matchLabels`. What must be true for a server to match?"
    options:
      - id: a
        text: "Both pairs must be present on the `Perses` resource."
        explanation: "Correct. `matchLabels` is an AND of all pairs."
      - id: b
        text: "Either pair is enough."
        explanation: "Not correct. That would be an OR."
      - id: c
        text: "Only the first pair is read."
        explanation: "Not correct. Every pair is read."
      - id: d
        text: "The pairs must be on the namespace."
        explanation: "Not correct. They must be on the `Perses` resource."
    correct_option: a
    explanation: "Correct. `matchLabels` is an AND of all pairs."

  - id: ats111-020-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the default"
    source_readings:
      - sections/section-020/module-02/course-01-several-servers-and-selectors.md
    prompt: "A `PersesDashboard` has no `instanceSelector`. Where does it go?"
    options:
      - id: a
        text: "To no server."
        explanation: "Not correct. It goes to all of them."
      - id: b
        text: "To every available Perses server the operator manages."
        explanation: "Correct. No selector means no restriction."
      - id: c
        text: "Only to the server in its own namespace."
        explanation: "Not correct. Namespaces do not decide it."
      - id: d
        text: "To the server with the oldest creation time."
        explanation: "Not correct. Age is not used."
    correct_option: b
    explanation: "Correct. No selector means no restriction."

  - id: ats111-020-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict what a narrowed selector does"
    source_readings:
      - sections/section-020/module-02/course-01-several-servers-and-selectors.md
    prompt: "You narrow a selector so it no longer matches the server `old`. What happens to the dashboard on `old`?"
    options:
      - id: a
        text: "It is deleted at once."
        explanation: "Not correct. No removal is done."
      - id: b
        text: "It is moved to the new server together with its data."
        explanation: "Not correct. It is sent again, not moved."
      - id: c
        text: "It stays there, so you check the old server after the change."
        explanation: "Correct. The operator does not remove the copy from a server that no longer matches."
      - id: d
        text: "The dashboard becomes `Degraded`."
        explanation: "Not correct. Nothing marks it as degraded."
    correct_option: c
    explanation: "Correct. The operator does not remove the copy from a server that no longer matches."

  - id: ats111-020-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the datasource form that can restrict"
    source_readings:
      - sections/section-020/module-02/course-02-datasource-proxy-settings.md
    prompt: "Which form of a Prometheus datasource can restrict the queries a dashboard sends?"
    options:
      - id: a
        text: "The direct URL form."
        explanation: "Not correct. The browser calls Prometheus itself, so the server cannot limit it."
      - id: b
        text: "Both forms, equally."
        explanation: "Not correct. Only the proxy can limit."
      - id: c
        text: "Neither form. Use a NetworkPolicy only."
        explanation: "Not correct. The proxy has its own list."
      - id: d
        text: "The proxy form, with `allowedEndpoints`."
        explanation: "Correct. Only the proxy forwards queries from the server."
    correct_option: d
    explanation: "Correct. Only the proxy forwards queries from the server."

  - id: ats111-020-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Prove an endpoint limit"
    source_readings:
      - sections/section-020/module-02/course-02-datasource-proxy-settings.md
    prompt: "How do you prove that `allowedEndpoints` works?"
    options:
      - id: a
        text: "A needed endpoint works and an endpoint outside the list is refused."
        explanation: "Correct. A limit is proved by both a yes and a no."
      - id: b
        text: "The `PersesDatasource` is `Available`."
        explanation: "Not correct. That says nothing about the list."
      - id: c
        text: "The dashboard renders one panel."
        explanation: "Not correct. The panel may use an allowed endpoint."
      - id: d
        text: "The YAML has the field."
        explanation: "Not correct. A field in YAML is not a result."
    correct_option: a
    explanation: "Correct. A limit is proved by both a yes and a no."

  - id: ats111-020-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find who validates a dashboard"
    source_readings:
      - sections/section-020/module-02/course-03-variables-and-layouts.md
    prompt: "Who validates the content of `spec.config` on a `PersesDashboard`?"
    options:
      - id: a
        text: "The Kubernetes API server, at apply time."
        explanation: "Not correct. It checks the schema only."
      - id: b
        text: "The Perses server, and it reports `ValidationFailed` in the conditions."
        explanation: "Correct. The operator copies the block as it is."
      - id: c
        text: "The operator, before it sends the object."
        explanation: "Not correct. The operator does not read the content."
      - id: d
        text: "Flux, before it applies the object."
        explanation: "Not correct. Flux does not know Perses."
    correct_option: b
    explanation: "Correct. The operator copies the block as it is."

  - id: ats111-020-q18
    type: single_choice
    difficulty: beginner
    learning_objective: "Read a layout"
    source_readings:
      - sections/section-020/module-02/course-03-variables-and-layouts.md
    prompt: "How does a layout item point to a panel?"
    options:
      - id: a
        text: "With the panel name in a `name` field."
        explanation: "Not correct. The reference form is used."
      - id: b
        text: "With the position in the list of panels."
        explanation: "Not correct. Panels are a map, not a list."
      - id: c
        text: "With a JSON reference such as `$ref: \"#/spec/panels/totals\"`."
        explanation: "Correct. The panel is defined once and referred to."
      - id: d
        text: "With a Kubernetes `ownerReference`."
        explanation: "Not correct. Panels are not Kubernetes objects."
    correct_option: c
    explanation: "Correct. The panel is defined once and referred to."

  - id: ats111-020-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a dry run"
    source_readings:
      - sections/section-020/module-02/course-04-preview-and-change-safely.md
    prompt: "What does a server-side dry run of a `PersesDashboard` check?"
    options:
      - id: a
        text: "Everything the Perses server checks."
        explanation: "Not correct. The dry run stops at the API server."
      - id: b
        text: "Only that the namespace exists."
        explanation: "Not correct. It checks much more than that."
      - id: c
        text: "That Prometheus answers the queries."
        explanation: "Not correct. No query is run."
      - id: d
        text: "The schema of the object, not the panels inside `spec.config`."
        explanation: "Correct. The panels are checked later by the Perses server."
    correct_option: d
    explanation: "Correct. The panels are checked later by the Perses server."

  - id: ats111-020-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Handle a stuck deletion"
    source_readings:
      - sections/section-020/module-02/course-04-preview-and-change-safely.md
    prompt: "An object stays in `Terminating`. What do you do first?"
    options:
      - id: a
        text: "Read `deletionTimestamp` and `finalizers` to see what holds it, before you remove anything."
        explanation: "Correct. A finalizer exists so a controller can clean up first."
      - id: b
        text: "Remove the finalizer at once."
        explanation: "Not correct. You may leave a copy on the server."
      - id: c
        text: "Delete the CRD."
        explanation: "Not correct. That removes every object of the kind."
      - id: d
        text: "Restart the Kubernetes API server."
        explanation: "Not correct. The cause is in the object."
    correct_option: a
    explanation: "Correct. A finalizer exists so a controller can clean up first."
